<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBD Test</title>
<style>
body{font-family:Tahoma,sans-serif;background:#F2F4F6;color:#16202B;margin:0;padding:16px;line-height:1.6}
.box{max-width:560px;margin:0 auto;background:#fff;border:1px solid #D8DEE5;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;margin:0}
.hint{font-size:13px;color:#5B6776}
button{font:inherit;font-weight:700;padding:12px;border-radius:8px;border:0;background:#1E4E79;color:#fff}
button:disabled{opacity:.5}
.vin{font-family:Menlo,monospace;font-size:24px;direction:ltr;text-align:center;padding:10px;border-radius:8px;background:#E3ECF5;min-height:1.5em}
.row{display:flex;justify-content:space-between;font-size:14px}
.row b{direction:ltr}
#st{font-weight:700}
pre{direction:ltr;text-align:left;font-size:11px;background:#16202B;color:#cfe;padding:10px;border-radius:8px;white-space:pre-wrap;margin:0}
</style>
</head>
<body>
<div class="box">
<h1>اختبار قراءة رقم الشاصي عبر OBD-II</h1>
<span class="hint">أوامر قراءة فقط، ولا يوجد أي أمر لمسح الأعطال أو البرمجة.</span>
<button id="go" type="button">اتصال وقراءة</button>
<div id="st"></div>
<div class="vin" id="vin"></div>
<div class="row"><span>البروتوكول</span><b id="proto">—</b></div>
<div class="row"><span>الجهاز</span><b id="dev">—</b></div>
<details><summary class="hint">السجل التقني</summary><pre id="log"></pre></details>
</div>
<script>
const $=id=>document.getElementById(id);
const log=t=>{$('log').textContent+=t+'\n';};
const st=t=>{$('st').textContent=t;};
const B='-0000-1000-8000-00805f9b34fb';
const SERVICES=['0000fff0'+B,'0000ffe0'+B,'000018f0'+B,'0000ffb0'+B,'e7810a71-73ae-499d-8c15-faa9aef0c3f2'];
const PROTO={'6':'ISO 15765-4 CAN (11 bit, 500 kbaud)','7':'ISO 15765-4 CAN (29 bit, 500 kbaud)','8':'ISO 15765-4 CAN (11 bit, 250 kbaud)','9':'ISO 15765-4 CAN (29 bit, 250 kbaud)','1':'SAE J1850 PWM','2':'SAE J1850 VPW','3':'ISO 9141-2','4':'ISO 14230-4 KWP','5':'ISO 14230-4 KWP fast'};
let wr=null,buf='',waiter=null,device=null;
function onData(e){
  buf+=new TextDecoder().decode(e.target.value);
  if(buf.indexOf('>')>=0&&waiter){const o=buf.replace('>','');buf='';const w=waiter;waiter=null;w(o);}
<script>
function send(cmd,ms){
  return new Promise(async res=>{
    buf='';waiter=res;
    setTimeout(()=>{if(waiter){waiter=null;res(buf+' [TIMEOUT]');}},ms||4000);
    const d=new TextEncoder().encode(cmd+'\r');
    for(let i=0;i<d.length;i+=20){const c=d.slice(i,i+20);
      if(wr.properties.writeWithoutResponse)await wr.writeValueWithoutResponse(c);else await wr.writeValue(c);}
    log('> '+cmd);
  }).then(r=>{log('< '+r.replace(/\r/g,' | ').trim());return r;});
}
function parseVin(raw){
  let hex='';
  raw.toUpperCase().split(/[\r\n]+/).forEach(l=>{
    l=l.replace(/\s+/g,'');
    if(/^[0-9A-F]{1,3}$/.test(l))return;
    if(/^[0-9A-F]:/.test(l))l=l.slice(2);else if(/^4902[0-9A-F]{2}/.test(l))l=l.slice(6);
    if(/^[0-9A-F]+$/.test(l))hex+=l;
  });
  let t='';
  for(let i=0;i+1<hex.length;i+=2){const c=parseInt(hex.substr(i,2),16);t+=(c>=48&&c<=57)||(c>=65&&c<=90)?String.fromCharCode(c):'.';}
  const m=t.match(/[A-HJ-NPR-Z0-9]{17}/);return m?m[0]:null;
}
async function go(){
  $('go').disabled=true;$('vin').textContent='';$('log').textContent='';
  try{
    if(!navigator.bluetooth){st('افتح الصفحة من Bluefy.');return;}
    st('اختر جهاز OBD من القائمة…');
    device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:SERVICES});
    $('dev').textContent=device.name||'-';log('device: '+device.name);
    st('جارٍ الاتصال…');
    const server=await device.gatt.connect();
    const services=await server.getPrimaryServices();
    let nt=null;
    for(const sv of services){log('service '+sv.uuid);
      let ch=[];try{ch=await sv.getCharacteristics();}catch(e){}
      for(const c of ch){const p=c.properties;log('  char '+c.uuid);
        if(!nt&&(p.notify||p.indicate))nt=c;if(!wr&&(p.write||p.writeWithoutResponse))wr=c;}
      if(nt&&wr)break;}
    if(!nt||!wr){st('لم يُعثر على قناة البيانات. أرسل السجل التقني.');return;}
    await nt.startNotifications();nt.addEventListener('characteristicvaluechanged',onData);
    st('جارٍ تهيئة الجهاز…');
    for(const c of ['ATZ','ATE0','ATL0','ATS0','ATH0','ATSP0'])await send(c,c==='ATZ'?6000:4000);
    st('جارٍ قراءة رقم الشاصي…');
    let r=await send('0902',10000);
    if(/SEARCHING/.test(r)&&!/49/.test(r))r=await send('0902',10000);
    const p=(await send('ATDPN')).replace(/[^0-9A-F]/gi,'');
    $('proto').textContent=PROTO[p.slice(-1)]||p||'—';
    const vin=parseVin(r);
    if(vin){$('vin').textContent=vin;st('تمت قراءة الرقم ✓');}
    else st('لم يُستخرج الرقم. أرسل السجل التقني.');
  }catch(e){log('ERROR: '+e);st('تعذّر الاتصال: '+e.message);}
  finally{try{if(device&&device.gatt.connected)device.gatt.disconnect();}catch(e){}wr=null;$('go').disabled=false;}
}
$('go').addEventListener('click',go);
</script>
</body>
</html>
